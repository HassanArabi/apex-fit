<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11100d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Golden Dumbbell</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<!--APP-START-->
<style>
/* Layout: one column, phone-first. Cards stack. Fixed bottom nav and rest banner. */
:root{
  --bg:#11100d; --surface:#1a1814; --surface2:#24211b; --line:#363026;
  --text:#f2ede3; --muted:#a59c8a; --accent:#dcaa3f; --accent-hi:#f3d27a; --accent-ink:#1d1606;
  --good:#5fd09a; --good-ink:#06180f; --danger:#ff6f61;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --nav-h:64px; --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{margin:0;font:16px/1.4 var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:640px;margin:0 auto;padding-inline:12px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 140px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 12px}
.brand{font-weight:800;letter-spacing:.02em;font-size:18px;display:flex;align-items:center;gap:8px}
.brand svg{width:34px;height:20px;flex:none}
.storewarn{background:#3a2a12;color:#ffd99a;border:1px solid #6b4b1c;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}

h2{font-size:22px;margin:4px 4px 12px;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Workout header */
.wkhead{display:grid;gap:10px;margin-bottom:14px}
.daterow{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}
.iconbtn{min-width:48px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:grid;place-items:center}
.date{text-align:center}
.date b{display:block;font-size:18px}
.date small{color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:48px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.seg button.on b{color:var(--accent)}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--good);border-radius:8px;transition:width .3s}

/* Exercise card */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.ex-h{padding:14px 14px 10px;display:grid;gap:6px}
.ex-title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-title h3{margin:0;font-size:20px;line-height:1.2}
.ex-title .num{color:var(--muted);font-weight:600;font-size:13px;margin-right:6px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px}
.meta .rx{font-weight:700;font-variant-numeric:tabular-nums}
.restchip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface2);font-size:14px;font-variant-numeric:tabular-nums}
.restchip::after{content:" ✎";color:var(--muted)}
.restedit{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.restedit button{min-width:56px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.restedit .val{min-width:64px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.mus{display:flex;flex-wrap:wrap;gap:6px}
.mus span{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:8px;background:rgba(255,111,97,.14);color:#ffb3aa}
.rm{min-height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}

.vis{position:relative;background:#1a1814;border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;touch-action:manipulation}
.vis svg{display:block;width:100%;height:auto}
.pp{position:absolute;right:8px;top:8px;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:rgba(17,16,13,.78);display:grid;place-items:center;pointer-events:none}
.pp svg{width:16px;height:16px}
.phases{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px 0;flex-wrap:wrap}
.ph{font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;background:var(--surface2);color:var(--muted);transition:background .2s,color .2s}
.ph em{font-style:normal;opacity:.7;margin-right:4px}
.ph.on{background:var(--accent);color:var(--accent-ink)}
.phases .arr{color:var(--muted)}
.cue{margin:10px 14px 0;font-weight:700;font-size:15px;text-align:center}
.how{margin:10px 14px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.how summary{min-height:48px;display:flex;align-items:center;padding:0 14px;font-weight:700;list-style:none;cursor:pointer}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"＋";margin-left:auto;color:var(--muted)}
.how[open] summary::after{content:"−"}
.how ol{margin:0;padding:0 16px 14px 34px;display:grid;gap:6px;font-size:15px}

.sets{padding:12px 14px 4px;display:grid;gap:8px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 56px;gap:8px;align-items:center}
.sethead{display:grid;grid-template-columns:34px 1fr 1fr 56px;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.setrow .sn{font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.setrow input{width:100%;min-width:0;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.setrow input::placeholder{color:#6b6252;font-weight:600}
.setrow input:focus{border-color:var(--accent);outline:none}
.chk{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center}
.chk svg{width:24px;height:24px;opacity:.35}
.setrow.done input{border-color:rgba(95,208,154,.45);background:rgba(95,208,154,.07)}
.setrow.done .chk{background:var(--good);border-color:var(--good)}
.setrow.done .chk svg{opacity:1;stroke:var(--good-ink)}
.setrow.done .sn{color:var(--good)}
.last{padding:4px 14px 14px;font-size:13px;color:var(--muted)}

.addbtn{width:100%;min-height:56px;border-radius:14px;border:1px dashed var(--line);background:transparent;color:var(--text);font-weight:700;font-size:16px}
.donebox{text-align:center;padding:16px;border-radius:var(--r);background:rgba(95,208,154,.1);border:1px solid rgba(95,208,154,.35);margin-bottom:16px;font-weight:700}

/* Generic panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.tile span{font-size:12px;color:var(--muted)}
.field{display:grid;gap:6px;margin-bottom:10px}
.field label{font-size:13px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:17px;width:100%;min-width:0}
.field textarea{padding:10px 12px;min-height:120px;font:13px/1.4 var(--mono)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:700;padding:0 16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:rgba(255,111,97,.5);color:var(--danger);background:transparent}
.btn.block{width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.list{display:grid}
.li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.li:first-child{border-top:0}
.li .x{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.sw{position:relative;width:56px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;pointer-events:none;border-radius:16px;background:var(--surface2);border:1px solid var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:var(--muted);transition:transform .2s,background .2s}
.sw input:checked + i{background:var(--good)}
.sw input:checked + i::after{transform:translateX(24px);background:#fff}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{min-width:48px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:800}
.stepper b{min-width:56px;text-align:center;font-variant-numeric:tabular-nums}

/* Rest timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:30;padding:0 10px 8px;pointer-events:none}
.timer-in{max-width:620px;margin:0 auto;background:#26221b;border:1px solid #443b2c;border-radius:18px;padding:10px 12px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);pointer-events:auto;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.timer .tl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tt{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.timer .tbtns{display:flex;gap:6px;grid-row:1 / span 2;grid-column:2}
.timer .tbtns button{min-width:52px;min-height:52px;border-radius:12px;border:1px solid #443b2c;background:#2f2a21;font-weight:800;font-size:15px}
.timer .tbtns .done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:64px}
.timer .tbar{grid-column:1 / span 2;height:8px;border-radius:8px;background:#14120e;overflow:hidden}
.timer .tbar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.timer.over .timer-in{border-color:var(--good)}
.timer.over .tbar i{background:var(--good)}
.timer.over .tt{color:var(--good)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(17,16,13,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;align-content:center;gap:3px;font-size:12px;font-weight:700}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet-in{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sheet-h h3{margin:0;font-size:18px}
.res{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.res b{display:block}
.res small{color:var(--muted)}
.res button{min-height:44px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:60;background:#2f2a21;border:1px solid #443b2c;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:90vw}
.confirm{display:grid;gap:10px;margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,111,97,.5);background:rgba(255,111,97,.08)}
.views{display:flex;align-items:center;gap:8px;padding:0 14px 10px}
.views span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.views div{display:inline-flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.views button{min-height:40px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:800;font-size:14px}
.views button.on{background:var(--accent);color:var(--accent-ink)}
.mist{margin:10px 14px 0;border:1px solid rgba(240,90,70,.38);background:rgba(240,90,70,.07);border-radius:12px}
.mist summary{min-height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:800;list-style:none;cursor:pointer}
.mist summary::-webkit-details-marker{display:none}
.mist summary::after{content:"−";margin-left:auto;color:var(--muted)}
.mist:not([open]) summary::after{content:"＋"}
.mist ul{margin:0;padding:0 14px 12px;list-style:none;display:grid;gap:10px}
.mist li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:15px}
.mist li b{display:block}
.mist li span.fix{color:var(--muted);font-size:14px}
.mist .x{color:#f0644e;font-weight:900}
.loadchip{min-height:30px;display:inline-flex;align-items:center;padding:0 10px;border-radius:15px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.sethead .each{color:var(--accent-hi)}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.phase summary{min-height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;list-style:none;cursor:pointer}
.phase summary::-webkit-details-marker{display:none}
.phase summary::after{content:"＋";color:var(--muted)}
.phase[open] summary::after{content:"−"}
.phase .ptitle{font-weight:800;font-size:18px}
.phase .pmeta{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.phase.complete .pmeta{color:var(--good)}
.phase ul{list-style:none;margin:0;padding:0 14px 6px;display:grid}
.pi{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pi .chk{min-height:48px}
.pi b{font-size:16px}
.pi b{display:block}
.pi .dose{display:block;color:var(--accent-hi);font-weight:700;font-size:14px}
.pi small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.pi.done .chk{background:var(--good);border-color:var(--good)}
.pi.done .chk svg{opacity:1;stroke:var(--good-ink)}
.pi.done b{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(165,156,138,.6)}
.ptimer{min-width:64px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;color:var(--accent-hi)}
.pnote{margin:0;padding:0 14px 14px;font-size:13px;color:var(--muted)}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.cardio{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;padding:14px}
.cardio h3{margin:0 0 4px;font-size:18px}
.cardio .sub{margin:0 0 8px;font-size:13px;color:var(--muted)}
.cline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cline b{display:block}
.cline small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.cline .x{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.machines{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.machines button{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:800;display:grid;place-items:center;gap:2px;font-size:14px}
.machines button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.machines svg{width:26px;height:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <div class="topbar"><div class="brand"><svg viewBox="0 0 68 40" aria-hidden="true"><defs><linearGradient id="gdb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d98a"/><stop offset=".5" stop-color="#dcaa3f"/><stop offset="1" stop-color="#8a6418"/></linearGradient></defs><rect x="2" y="6" width="12" height="28" rx="4" fill="url(#gdb)"/><rect x="54" y="6" width="12" height="28" rx="4" fill="url(#gdb)"/><rect x="14" y="16" width="40" height="8" rx="3" fill="url(#gdb)"/></svg>Golden Dumbbell</div><div class="small muted" id="unitTag"></div></div>
  <div class="storewarn" id="storeWarn" hidden>This browser blocks saved data here. Your entries will be lost when you close the page. Use Settings → Backup often, or open the app from a normal web address.</div>
  <main id="view"></main>
</div>

<div class="timer" id="timer" hidden>
  <div class="timer-in">
    <div class="tl" id="tLabel">Rest</div>
    <div class="tbtns">
      <button type="button" data-act="tAdj" data-d="-15" aria-label="Remove 15 seconds">−15</button>
      <button type="button" data-act="tAdj" data-d="15" aria-label="Add 15 seconds">+15</button>
      <button type="button" class="done" data-act="tDone">Done</button>
    </div>
    <div class="tt" id="tTime">0:00</div>
    <div class="tbar"><i id="tBar"></i></div>
  </div>
</div>

<nav class="nav" aria-label="Sections"><div class="nav-in">
  <button type="button" data-tab="workout" class="on"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Workouts</button>
  <button type="button" data-tab="weight"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9.5a4 4 0 0 1 6 0M12 10.5l1.5-2"/></svg>Weight</button>
  <button type="button" data-tab="analytics"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16v-4M12 16V7M17 16v-7"/></svg>Analytics</button>
  <button type="button" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>Settings</button>
</div></nav>

<div id="sheetHost"></div>

<script>
"use strict";
/* =========================================================
   1. STORAGE  (key apex_fit_pwa_v2 kept for old data, schema version 4)
   ========================================================= */
const KEY = 'apex_fit_pwa_v2';
const SCHEMA = 4;
let storageOK = true;
const mem = {};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ storageOK=false; return mem[k]??null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ storageOK=false; mem[k]=v; } }
(function probe(){ try{ localStorage.setItem('__apex_probe','1'); localStorage.removeItem('__apex_probe'); }catch(e){ storageOK=false; } })();

function defaults(){

  if(raw.viewPref && typeof raw.viewPref==='object') for(const k in raw.viewPref) d.viewPref[k]=String(raw.viewPref[k]);
  const p = raw.preferences || raw.prefs || raw.settings || {};
  d.preferences.defaultRest = num(p.defaultRest) || d.preferences.defaultRest;
  ['animations','autoTimer','sound','vibrate'].forEach(k=>{ if(typeof p[k]==='boolean') d.preferences[k]=p[k]; });

    for(const k in raw.restOverrides){ const v=num(raw.restOverrides[k]); if(v) d.restOverrides[k]=v; }

    if(!e) return;

    if(value==null || !e.date) return;
    d.weights.push({ date:String(e.date).slice(0,10), value, note:String(e.note||''), u: (e.u==='lb'||e.unit==='lb'||e.unit==='lbs')?'lb':(e.u||e.unit)?'kg':oldUnit });
  });

  const WK = raw.workouts || raw.logs || raw.sessions || {};
  const entries = Array.isArray(WK) ? WK.map(s=>[s.date,s]) : Object.entries(WK);
  entries.forEach(([date,s])=>{
    if(!date || !s) return;
    const out = { workout:(['A','B','C'].includes(s.workout)?s.workout:(s.type==='B'?'B':'A')), exercises:{}, extra:Array.isArray(s.extra)?s.extra.slice():[],
      warm: (s.warm && typeof s.warm==='object') ? Object.assign({},s.warm) : {},
      cool: (s.cool && typeof s.cool==='object') ? Object.assign({},s.cool) : {},
      cardio: Array.isArray(s.cardio) ? s.cardio.filter(c=>c&&typeof c==='object').map(c=>Object.assign({},c)) : [] };

      const sets = Array.isArray(ex[id]) ? ex[id] : (ex[id] && ex[id].sets) || [];

  });

  if(Array.isArray(CX)) CX.forEach(c=>{ if(c && c.name){ d.customExercises.push({
      id: c.id || ('c_'+Math.random().toString(36).slice(2,8)), name:String(c.name),
      muscles: Array.isArray(c.muscles)?c.muscles:String(c.muscles||'').split(',').map(s=>s.trim()).filter(Boolean),
      sets: num(c.sets)||3, reps: String(c.reps||c.repRange||'8–12'), rest: num(c.rest)||90,
      type: ['reps','time','distance','steps'].includes(c.type)?c.type:'reps', load: ['pair','single','machine','body'].includes(c.load)?c.load:'single', custom:true }); } });

const LB = 2.2046226;

/* =========================================================

   Two rigs share the same body parts.
   - Side rig: the figure faces right. Angles: 0 right, 90 down, -90 up, 180 left.
   - Front rig: the figure faces the viewer. It also draws the view from above
     for exercises on a bench. Each limb has an angle and a foreshortening

     'r' is the person's right side (viewer's left). The left side mirrors it.

const D2R = Math.PI/180;

  skin:'#d39a74', skinF:'#a8714f', hair:'#2b211b',
  shirt:'#3d8bfd', shirtF:'#2c64bd', shorts:'#4c5664', shortsF:'#363e49',
  shoe:'#f3f5f7', shoeF:'#b9c1c9', sole:'#56616d',
  line:'#0c0f12',
  metal:'#aaa59b', metalD:'#6f695f', pad:'#36312b', padE:'#51493e', iron:'#5f5a52', ironL:'#8e887e',
  gold:'#d6a33a', goldL:'#f4d27a', goldD:'#8f6a1c',
  hl:'#ff5a46', arrow:'#f3c552', bg:'#1a1814', floor:'#24211b', floorL:'#3b352c',

function ik(a,b,L1,L2,s){
  const dx=b[0]-a[0], dy=b[1]-a[1];

/* ---------- side rig ---------- */
function solve(p, ex){
  const J = { torsoA:p.torso, headA:(p.head!=null?p.head:p.torso) };
  const hip = p.hip ? p.hip.slice() : [0,0];
  J.hip = hip;

  J.shoulder = add(hip, V(p.torso, LEN.sh));
  J.headC = add(J.neck, V(J.headA, LEN.neck+LEN.head));
  for(const s of ['n','f']){
    const L = (p.legs[s]||p.legs.n), A = (p.arms[s]||p.arms.n), o = {};

    if(L.ik){ [th,sh] = ik(hip, L.ik, LEN.thigh, LEN.shin, L.bend); ft = L.foot; } else { [th,sh,ft] = L; }
    o.thighA=th; o.shinA=sh; o.footA=ft;

    let up, fo;
    if(A.ik){ [up,fo] = ik(J.shoulder, A.ik, LEN.upper, LEN.fore, A.bend); } else { [up,fo] = A; }

    ['n','f'].forEach(s=>['knee','ankle','toe','elbow','hand'].forEach(k=>J[s][k]=add(J[s][k],d)));
  }

  J.f.hip = add(J.hip, fo.leg); shiftSide(J.f, fo.leg);
  J.f.shoulder = add(J.shoulder, fo.arm);
  J.f.elbow = add(J.f.elbow, fo.arm); J.f.hand = add(J.f.hand, fo.arm);
  return J;
}

/* ---------- front rig ---------- */
const FW = { sh:17, hip:8.5 };
function solveF(p){
  const tf = p.tf!=null ? p.tf : 1, hf = p.hf!=null ? p.hf : 1, Pv = p.pelvis.slice();

    const k = s==='r' ? -1 : 1, m = a => s==='r' ? a : 180-a;
    const L = p.legs[s]||p.legs.r, A = p.arms[s]||p.arms.r, o = { k };
    o.hip = [Pv[0]+k*FW.hip, Pv[1]]; o.sh = [J.sc[0]+k*FW.sh, J.sc[1]];
    o.thA = m(L[0]); o.thF = L[1]; o.knee = add(o.hip, V(o.thA, LEN.thigh*L[1]));
    o.shA = m(L[2]); o.shF = L[3]; o.ankle = add(o.knee, V(o.shA, LEN.shin*L[3]));

/* ---------- target-muscle highlights ---------- */
const HL_OP = 'opacity=".6"';
function highlights(J,list,group){
  const n=J.n, tA=J.torsoA, F=V(tA+90,1), B=V(tA-90,1);
  const at=(k,off)=>add(add(J.hip,V(tA,k)),[F[0]*off,F[1]*off]);
  const segOff=(a,b,ang,off,t0,t1)=>{ const d=V(ang,off); return [add(mix(a,b,t0),d), add(mix(a,b,t1),d)]; };
  const H=(a,b,r1,r2)=>cap(a,b,r1,r2,C.hl,0,HL_OP);
  let s='';
  list.forEach(m=>{
    if(group==='body'){
      if(m==='quads'){ const [a,b]=segOff(n.hip,n.knee,n.thighA-90,3.2,.3,.82); s+=H(a,b,5.5,4.2); }
      if(m==='hamstrings'){ const [a,b]=segOff(n.hip,n.knee,n.thighA+90,3.2,.3,.85); s+=H(a,b,5.5,4.2); }
      if(m==='glutes'){ s+=circ(add(add(J.hip,[B[0]*7,B[1]*7]),V(tA,-3)),8,C.hl,0,HL_OP); }
      if(m==='calves'){ const [a,b]=segOff(n.knee,n.ankle,n.shinA+90,2.5,.15,.6); s+=H(a,b,4.5,3.5); }
      if(m==='chest'){ s+=H(at(30,8),at(41,8.5),6.5,6); }
      if(m==='core'){ s+=H(at(6,8.5),at(24,9.5),5.2,5.2); }
      if(m==='back'){ s+=H(at(20,-8),at(40,-9),6.5,6.5); }
    } else {
      if(m==='shoulders'){ s+=circ(add(J.shoulder,V(tA,-1)),7.2,C.hl,0,HL_OP); }
      if(m==='triceps'){ const [a,b]=segOff(n.shoulder,n.elbow,n.upperA+90,2,.35,.9); s+=H(a,b,3.8,3.2); }
      if(m==='biceps'){ const [a,b]=segOff(n.shoulder,n.elbow,n.upperA-90,2,.35,.9); s+=H(a,b,3.8,3.2); }
      if(m==='grip'){ s+=H(mix(n.elbow,n.hand,.2),mix(n.elbow,n.hand,.85),3.6,3); }
    }
  });
  return s;
}
function highlightsF(J,list,group){
  const H=(a,b,r1,r2)=>cap(a,b,r1,r2,C.hl,0,HL_OP);
  const sc=J.sc, Pv=J.P, tf=J.tf; let s='';
  list.forEach(m=>{
    if(group==='body'){
      if(m==='quads') ['r','l'].forEach(k=>{ const o=J[k]; s+=H(mix(o.hip,o.knee,.3),mix(o.hip,o.knee,.86),5.6,4.4); });
      if(m==='chest') [-1,1].forEach(k=>{ s+=`<ellipse cx="${f1(sc[0]+k*8.6)}" cy="${f1(sc[1]+2+9*tf)}" rx="7.6" ry="${f1(Math.max(3.6,6.2*tf))}" fill="${C.hl}" ${HL_OP}/>`; });
      if(m==='core') s+=H([Pv[0],Pv[1]-11],[Pv[0],Pv[1]-11-16*tf],6.2,6.2);
      if(m==='back') [-1,1].forEach(k=>{ s+=H([sc[0]+k*15,sc[1]+8*tf],[Pv[0]+k*12.6,Pv[1]-15*tf],3.6,3); });
      if(m==='traps') [-1,1].forEach(k=>{ s+=H([sc[0]+k*4.5,sc[1]-5],[sc[0]+k*13,sc[1]-2.5],3.2,2.8); });
    } else {
      if(m==='shoulders') ['r','l'].forEach(k=>{ s+=circ(J[k].sh,6.8,C.hl,0,HL_OP); });
      if(m==='biceps') ['r','l'].forEach(k=>{ const o=J[k]; if(o.uF>.45) s+=H(mix(o.sh,o.elbow,.35),mix(o.sh,o.elbow,.9),3.8,3.2); });
      if(m==='grip') ['r','l'].forEach(k=>{ const o=J[k]; if(o.fF>.4) s+=H(mix(o.elbow,o.hand,.2),mix(o.elbow,o.hand,.85),3.6,3); });
    }
  });
  return s;
}
/* ---------- arrows ---------- */
function arrowSVG(pts,col=C.arrow){
  if(pts.length<2) return '';
  const a=pts[pts.length-2], b=pts[pts.length-1], ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
  const h1=[b[0]-Math.cos(ang-.5)*9, b[1]-Math.sin(ang-.5)*9], h2=[b[0]-Math.cos(ang+.5)*9, b[1]-Math.sin(ang+.5)*9];
  const d='M'+pts.map(P).join('L');
  return `<path d="${d}" fill="none" stroke="${C.bg}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>`+
    `<path d="${d}" fill="none" stroke="${col}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>`+
    `<path d="M${P(h1)}L${P(b)}L${P(h2)}" fill="none" stroke="${col}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>`;
}
const arrowCache = {};
function arrowPts(v){
  const key = v.id+':'+v.key;
  if(arrowCache[key]) return arrowCache[key];
  const sol = v.kind==='front' ? (p=>solveF(p)) : (p=>solve(p,v));
  const out = (v.arrows||[]).map(a=>{
    if(a.fixed) return a.fixed;
    const pts=[];
    for(let i=0;i<=16;i++){ const tt=.04+.92*i/16; const J=sol(lerp(v.A,v.B,tt)); pts.push(add(getPt(J,a.joint),a.off)); }
    return pts;
  });
  return arrowCache[key]=out;
}

/* ---------- views + scene ---------- */
function viewsOf(ex){
  if(ex.views) return ex.views;
  const side = { key:'side', label:'Side', kind:'side', id:ex.id, A:ex.A, B:ex.B, draw:ex.draw, hl:ex.hl, arrows:ex.arrows, farOff:ex.farOff, vb:ex.vb, notes:ex.notes };
  const list = [side];
  if(ex.front){ const top = !!ex.front.top; list.push(Object.assign({ key:top?'top':'front', label:top?'From above':'Front', kind:'front', id:ex.id }, ex.front)); }
  if(ex.frontFirst) list.reverse();
  return ex.views = list;
}
function viewOf(ex,key){ const vs=viewsOf(ex); return vs.find(v=>v.key===key) || vs[0]; }
function notesSVG(v,J,t){
  let s='';
  (v.notes||[]).forEach(n=>{
    if(n.when && !n.when(t)) return;
    if(n.svg) s += n.svg(J,t);
    if(n.text) s += note(n.at ? n.at(J,t) : null, n.text, n.x, n.y, n.bad);
  });
  return s;
}
function scene(v,t,dir,ms,showArrow=true){
  const front = v.kind==='front';
  const J = front ? solveF(lerp(v.A,v.B,t)) : solve(lerp(v.A,v.B,t), v);
  const E = v.draw || (()=> '');
  const c = { J, t, ms };
  let s = `<rect x="-20" y="-20" width="340" height="240" fill="${v.top?C.floor:C.bg}"/>`;
  if(!v.top) s += `<rect x="-20" y="${GROUND}" width="340" height="40" fill="${C.floor}"/>`+line([-20,GROUND],[320,GROUND],C.floorL,1.5);
  s += E('back',c);
  if(front){
    if(!v.legsOver) s += legF(J.r)+legF(J.l);
    s += torsoF(J);
    if(v.legsOver) s += legF(J.r)+legF(J.l);
    s += E('legs',c);
    s += highlightsF(J, v.hl||[], 'body');
    s += E('mid',c);
    s += armF(J.r)+armF(J.l);
    s += highlightsF(J, v.hl||[], 'arm');
  } else {
    s += leg(J.f,false);
    s += arm(J.f,false);
    s += E('farHand',c);
    s += torso(J);
    s += leg(J.n,true);
    s += highlights(J, v.hl||[], 'body');
    s += E('mid',c);
    s += arm(J.n,true);
    s += highlights(J, v.hl||[], 'arm');
  }
  s += E('front',c);
  if(showArrow){
    arrowPts(v).forEach((pts,i)=>{
      const a = v.arrows[i];
      if(a.fixed){ s += arrowSVG(pts); return; }
      s += arrowSVG(dir>0 ? pts : pts.slice().reverse());
    });
  }
  s += notesSVG(v,J,t);
  return s;
}

async function lockScreen(on){
  try{ if(on && 'wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>wake=null); }
       if(!on && wake){ await wake.release(); wake=null; } }catch(e){ wake=null; }
}
function startRest(sec,name,opt){
  clearInterval(T.iv); clearTimeout(T.hideT);
  opt = opt||{};
  T.total = sec; T.end = Date.now()+sec*1000; T.name = name; T.fired = false;
  T.kind = opt.kind||'Rest'; T.onDone = opt.onDone||null; T.next = opt.next||null;
  timerEl.hidden = false; timerEl.classList.remove('over');
  lockScreen(true); tick(); T.iv = setInterval(tick, 250);
}
function tick(){
  const rem = Math.max(0, (T.end - Date.now())/1000);
  const m = Math.floor(Math.ceil(rem)/60), s = Math.ceil(rem)%60;
  document.getElementById('tTime').textContent = rem>0 ? `${m}:${String(s).padStart(2,'0')}` : (T.kind==='Rest' ? 'Go!' : 'Done');
  document.getElementById('tLabel').textContent = rem>0 ? `${T.kind} · ${T.name}` : (T.kind==='Rest' ? 'Rest over · next set' : `${T.name} · done`);
  document.getElementById('tBar').style.width = (T.total ? Math.min(100, rem/T.total*100) : 0)+'%';
  if(rem<=0 && !T.fired){
    T.fired = true; timerEl.classList.add('over'); beep(); buzz([220,120,220,120,350]);
    clearInterval(T.iv);
    if(T.next){ const n=T.next; T.hideT = setTimeout(()=>startRest(n.sec,n.name,n.opt), 2500); return; }
    if(T.onDone){ try{ T.onDone(); }catch(e){} T.onDone=null; }
    T.hideT = setTimeout(stopRest, 5000);
  }
}
function stopRest(){ clearInterval(T.iv); clearTimeout(T.hideT); timerEl.hidden = true; lockScreen(false); }
function adjRest(d){
  if(T.fired) { startRest(Math.max(15,d),T.name,{kind:T.kind}); return; }
  T.end = Math.max(Date.now()+1000, T.end + d*1000);
  T.total = Math.max(1, T.total + d); tick();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !timerEl.hidden && !T.fired) { tick(); lockScreen(true); } });

function lineChart(pts, opts={}){
  const W=340, H=170, L=40, R=12, Tp=14, Bt=26;
  if(pts.length<2) return `<p class="muted small">Add at least two entries to see a trend.</p>`;
  const ys = pts.map(p=>p.y); let lo=Math.min(...ys), hi=Math.max(...ys);
  if(hi-lo<1){ lo-=.5; hi+=.5; } const pad=(hi-lo)*.12; lo-=pad; hi+=pad;
  const X = i => L + (W-L-R)*(i/(pts.length-1)), Y = v => Tp + (H-Tp-Bt)*(1-(v-lo)/(hi-lo));
  const d = pts.map((p,i)=>(i?'L':'M')+f1(X(i))+' '+f1(Y(p.y))).join('');
  const area = d + `L${f1(X(pts.length-1))} ${H-Bt}L${L} ${H-Bt}Z`;
  const ticks = [lo+pad, (lo+hi)/2, hi-pad];
  const lp = pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Trend chart')}">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}" stroke="#363026" stroke-width="1"/><text x="${L-6}" y="${f1(Y(v)+4)}" text-anchor="end" fill="#a59c8a" font-size="11" font-family="system-ui,sans-serif">${fmtN(v,1)}</text>`).join('')}
    <path d="${area}" fill="#dcaa3f" opacity=".12"/>
    <path d="${d}" fill="none" stroke="#dcaa3f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length<=30?pts.map((p,i)=>`<circle cx="${f1(X(i))}" cy="${f1(Y(p.y))}" r="3" fill="#11100d" stroke="#dcaa3f" stroke-width="2"/>`).join(''):''}
    <circle cx="${f1(X(pts.length-1))}" cy="${f1(Y(lp.y))}" r="5" fill="#dcaa3f"/>
    <text x="${L}" y="${H-8}" fill="#a59c8a" font-size="11" font-family="system-ui,sans-serif">${esc(pts[0].label)}</text>
    <text x="${W-R}" y="${H-8}" text-anchor="end" fill="#a59c8a" font-size="11" font-family="system-ui,sans-serif">${esc(lp.label)}</text>
  </svg>`;
}

function renderCardioAnalytics(m){
  const du = distUnit(m), rows=[];

  const tot = rows.reduce((a,r)=>a+(r.c.min||0),0);

  const totD = dists.reduce((a,x)=>a+x.v,0);
  const longest = rows.reduce((a,r)=>Math.max(a,r.c.min||0),0);
  const wkAgo = iso(new Date(Date.now()-6*864e5)); const week = rows.filter(r=>r.d>=wkAgo).reduce((a,r)=>a+(r.c.min||0),0);
  const byDay = {}; rows.forEach(r=>{ byDay[r.d]=(byDay[r.d]||0)+(r.c.min||0); });

    case 'delW': { const W=S.weights.slice().sort((x,y)=>x.date<y.date?-1:1); const victim=W[+b.dataset.i]; S.weights=S.weights.filter(w=>w!==victim); confirmDelW=null; save(true); renderWeight(); toast('Entry deleted'); break; }
    case 'units': S.units=b.dataset.u; save(true); render(); break;
    case 'defRest': S.preferences.defaultRest=Math.max(15,Math.min(600,S.preferences.defaultRest+ +b.dataset.d)); save(true); renderSettings(); break;
    case 'resetRests': S.restOverrides={}; save(true); toast('Rest times reset'); break;
    case 'export': {
      try{ const blob=new Blob([backupJSON()],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a');
        l.href=u; l.download=`golden-dumbbell-backup-${iso(new Date())}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
        toast('Backup downloaded. If no file appears, use Copy backup text.'); }catch(err){ toast('Download blocked. Use Copy backup text.'); }
      break; }
    case 'copyBackup': {
      backupText = backupJSON();
      const done = ()=>toast('Backup copied');
      try{ navigator.clipboard.writeText(backupText).then(done,()=>{ renderSettings(); toast('Copy blocked. Select the text below.'); }); }catch(err){ renderSettings(); }
      renderSettings(); break; }
    case 'importTxt': { const t=document.getElementById('importTxt').value.trim(); if(t) doImport(t); break; }
    case 'askReset': confirmReset=true; renderSettings(); break;
    case 'cancelReset': confirmReset=false; renderSettings(); break;
    case 'doReset': S=defaults(); save(true); confirmReset=false; toast('All data deleted'); render(); break;
  }
});
function rerenderCard(id){
  const card = view.querySelector(`.ex[data-id="${CSS.escape(id)}"]`); if(!card){ renderWorkout(); return; }
  const sess = sessionFor(curDate,false), ids = sessionIds(sess), i = ids.indexOf(id);
  const tmp = document.createElement('div'); tmp.innerHTML = cardHTML(getEx(id), sess, i+1, (sess.extra||[]).includes(id));
  const fresh = tmp.firstElementChild;
  const oldVis = card.querySelector('.vis[data-id]'), newVis = fresh.querySelector('.vis[data-id]');
  if(oldVis && newVis){ newVis.replaceWith(oldVis); }
  const how = card.querySelector('details.how'); if(how && how.open) fresh.querySelector('details.how')?.setAttribute('open','');
  card.replaceWith(fresh);
}
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.matches('.setrow input')) onInput(t);
  else if(t.id==='exSearch'){ sheetQ=t.value; const pos=t.selectionStart; renderSheet(); const n=document.getElementById('exSearch'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(err){} }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.matches('[data-pref]')){ S.preferences[t.dataset.pref]=t.checked; save(true); if(t.dataset.pref==='sound' && t.checked) unlockAudio(); if(t.dataset.pref==='animations') toast(t.checked?'Animations on':'Animations off'); }
  else if(t.id==='anSel'){ anEx=t.value; renderAnalytics(); }
  else if(t.id==='importFile' && t.files[0]){ const r=new FileReader(); r.onload=()=>doImport(String(r.result)); r.readAsText(t.files[0]); }
});
document.addEventListener('submit', e=>{
  e.preventDefault();
  const f = e.target;
  if(f.id==='wForm'){
    const v = num(document.getElementById('wVal').value.replace(',','.')), d = document.getElementById('wDate').value;
    if(v==null || v<=0 || !d){ toast('Enter a date and a weight.'); return; }
    S.weights = S.weights.filter(w=>w.date!==d);
    S.weights.push({ date:d, value:v, note:document.getElementById('wNote').value.trim(), u:S.units });
    S.weights.sort((a,b)=>a.date<b.date?-1:1); save(true); toast('Weight saved'); renderWeight();
  }
  if(f.id==='cardioForm'){ try{ saveCardio(); }catch(err){} return; }
  if(f.id==='customForm'){
    const name = document.getElementById('cxName').value.trim(); if(!name){ toast('Enter a name.'); return; }
    const c = { id:'c_'+Date.now().toString(36), name, custom:true,
      muscles: document.getElementById('cxMus').value.split(',').map(s=>s.trim()).filter(Boolean),
      sets: Math.max(1,Math.min(10, parseInt(document.getElementById('cxSets').value)||3)),
      reps: document.getElementById('cxReps').value.trim()||'8–12',
      rest: Math.max(15,Math.min(600, parseInt(document.getElementById('cxRest').value)||S.preferences.defaultRest)),
      type: document.getElementById('cxType').value, load: document.getElementById('cxLoad').value };
    S.customExercises.push(c);
    const s = sessionFor(curDate,true); s.extra = s.extra||[]; s.extra.push(c.id);
    save(true); closeSheet(); renderWorkout(); toast('Custom exercise saved');
  }
});

(function sw(){
  try{ if('serviceWorker' in navigator && location.protocol==='https:' && !/claude\.(ai|site)$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
})();
(function manifest(){
  if(document.querySelector('link[rel=manifest]')) return;
  try{
    const icon = 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#11100d"/><rect x="80" y="176" width="64" height="160" rx="18" fill="#dcaa3f"/><rect x="368" y="176" width="64" height="160" rx="18" fill="#dcaa3f"/><rect x="144" y="232" width="224" height="48" rx="16" fill="#f3d27a"/></svg>`);
    const m = { name:'Golden Dumbbell', short_name:'Golden Dumbbell', start_url: location.href.split('#')[0], display:'standalone', background_color:'#11100d', theme_color:'#11100d', icons:[{ src:icon, sizes:'512x512', type:'image/svg+xml', purpose:'any' }] };
    const l = document.createElement('link'); l.rel='manifest'; l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m)); document.head.appendChild(l);
  }catch(e){}
})();
render();
